<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;padding:22px;font:13px -apple-system,BlinkMacSystemFont,Arial,sans-serif;color:var(--figma-color-text,#202124);background:var(--figma-color-bg,#fff)}h1{font-size:19px;margin:0 0 6px;letter-spacing:-.4px}p{line-height:1.45;color:var(--figma-color-text-secondary,#777);margin:0 0 19px}label{font-weight:600;display:block;margin-bottom:7px}input{font:inherit;width:100%;box-sizing:border-box;padding:10px;border:1px solid #d4d4d7;border-radius:8px}button{cursor:pointer;padding:11px 15px;border-radius:8px;border:1px solid #d2d3d6;background:white;font:600 13px inherit;color:#202124}button.primary{background:#222;color:white;border-color:#222}button:disabled{opacity:.55}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.diff{margin-top:18px;max-height:155px;overflow:auto}.line{border-bottom:1px solid #eee;padding:9px 0;display:flex;justify-content:space-between;gap:9px}.line b{font-size:12px}.line span{color:#75777e}#message{margin-top:13px;color:#666;line-height:1.5}.warn{color:#b43535!important}</style></head><body><h1>Design Drift Sync</h1><p>Compare Penny tokens in this Figma file with a public GitHub snapshot. Nothing changes until you apply an update.</p><label for="url">GitHub token file</label><input id="url" spellcheck="false" value="https://raw.githubusercontent.com/mail2tarunv-cpu/tarun-portfolio/experiment/design-drift/experiments/design-drift/sync/penny.tokens.json"><div class="actions"><button class="primary" id="preview">Compare versions</button><button id="export">Export Figma tokens</button></div><div id="diff" class="diff"></div><div class="actions"><button id="apply" disabled>Apply reviewed updates</button></div><div id="message"></div><div style="border-top:1px solid #e7e7e9;margin-top:22px;padding-top:15px"><h2 style="font-size:14px;margin:0 0 7px">Propose Figma changes to GitHub</h2><p>Creates a new branch and pull request. Nothing merges automatically. Your token is used for this request only.</p><label for="githubToken">GitHub fine-grained token</label><input id="githubToken" type="password" autocomplete="off" placeholder="Contents + Pull requests write access"><div class="actions"><button id="propose">Create pull request</button></div><div id="proposedLink" style="margin-top:10px"></div></div><script>const $=id=>document.getElementById(id);let changes=[];let source='';function msg(m,bad=false){$('message').textContent=m;$('message').className=bad?'warn':''}function ask(type,more={}){parent.postMessage({pluginMessage:{type,url:$('url').value,...more}},'*')}function download(text,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}$('preview').onclick=()=>{source=$('url').value;ask('preview');msg('Comparing…')};$('apply').onclick=()=>{if($('url').value!==source){msg('Token URL changed. Compare again.',true);return}if(!confirm('Apply '+changes.length+' token updates to this Figma file?'))return;ask('apply',{confirmed:true})};$('export').onclick=()=>ask('export');$('propose').onclick=()=>{const token=$('githubToken').value;if(!token){msg('Enter a GitHub token inside Figma.',true);return}if(!confirm('Create a GitHub branch and pull request with your current Figma token values?'))return;ask('propose',{token});$('githubToken').value='';msg('Creating a pull request…')};onmessage=e=>{const m=e.data.pluginMessage||{};if(m.type==='error')msg(m.message,true);if(m.type==='preview'){changes=m.changes||[];$('diff').textContent='';for(const c of changes){const row=document.createElement('div');row.className='line';const b=document.createElement('b'),v=document.createElement('span');b.textContent=c.name;v.textContent=c.from+' → '+c.to;row.append(b,v);$('diff').append(row)}$('apply').disabled=!changes.length;msg(changes.length?changes.length+' changes found in version '+m.version:'Already up to date.')}if(m.type==='applied'){$('apply').disabled=true;msg('Updated '+m.changes.length+' token values. Bound components now use the new values.')}if(m.type==='proposed'){const el=$('proposedLink');el.textContent='';if(m.unchanged){msg('No changes to propose.')}else{const a=document.createElement('a');a.href=m.url;a.textContent='Open GitHub pull request';a.target='_blank';a.rel='noopener';el.append(a);msg('Created a pull request with '+m.changes.length+' token changes. Review it in GitHub.')}}if(m.type==='export')download(JSON.stringify({tokens:m.tokens},null,2),'penny-figma-tokens.json')};</script></body></html>
