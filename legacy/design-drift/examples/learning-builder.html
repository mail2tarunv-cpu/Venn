<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learning Builder — Design Drift example</title>
<style>body{font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f6f7;color:#232426;min-height:100vh;margin:0;display:grid;place-items:center}main{background:white;max-width:540px;width:calc(100% - 50px);padding:35px;border:1px solid #e6e8eb;border-radius:18px}h1{font-size:28px;letter-spacing:-1px;margin:0 0 9px}p{color:#73767c;line-height:1.5;margin:0 0 30px}label{display:block;font-weight:600;margin:20px 0 8px}input,textarea{box-sizing:border-box;width:100%;padding:13px 15px;border:1px solid #dce0e5;border-radius:10px;font:inherit}textarea{min-height:104px;resize:vertical}button{font:inherit;font-weight:650;background:#1f2422;color:#fff;border:none;border-radius:10px;padding:14px 20px;margin-top:24px;cursor:pointer}output{display:block;margin-top:20px;padding:16px;background:#f7f8f7;border-radius:10px;color:#315c4c}</style>
<main><small>LEARNING BUILDER · INDEPENDENT EXAMPLE</small><h1>Create a learning assistant</h1><p>Set a learning goal and choose how the assistant should guide students.</p><label for="goal">Learning goal</label><input id="goal" value="Help students understand fractions"><label for="guidance">Guidance</label><textarea id="guidance">Ask students what they've tried before offering a hint. Never provide the full solution first.</textarea><button id="create">Create assistant</button><output id="result" hidden></output></main>
<script>document.getElementById('create').onclick=()=>{const g=document.getElementById('goal').value.trim();const d=document.getElementById('guidance').value.trim();const o=document.getElementById('result');o.hidden=false;o.textContent=g&&d?'Assistant created locally: '+g:'Add a learning goal and guidance to continue.'}</script></html>
