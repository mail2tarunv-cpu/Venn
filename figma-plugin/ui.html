<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  /* Same system as the Venn site: graphite layers, one cobalt accent, amber for drift. */
  :root {
    --window: #f4f4f5; --card: #fff; --raised: #f4f4f5; --ink: #18181b; --ink-2: #52525b; --ink-3: #71717a;
    --line: rgba(24,24,27,.07); --line-2: rgba(24,24,27,.13); --accent: #1f5fd0; --accent-ink: #1a4fae; --accent-wash: rgba(31,95,208,.07);
    --amber: #f59e0b; --warn: #b45309; --warn-bg: #fef3c7; --good: #15803d; --good-bg: #dcfce7; --bad: #dc2626; --bad-bg: #fef2f2;
    --shadow: 0 1px 2px rgba(24,24,27,.04);
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    font: 400 12.5px/18px var(--sans); color: var(--ink); background: var(--window); -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--window); }
  body { display: flex; flex-direction: column; }
  p { margin: 0; }
  .mono { font-family: var(--mono); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .hidden { display: none !important; }

  header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; }
  .brand { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 14px; letter-spacing: -.01em; }
  .brand svg { width: 22px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; }
  .source { margin-left: auto; display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border-radius: 7px; background: var(--card); box-shadow: var(--shadow), 0 0 0 1px var(--line); color: var(--ink-2); max-width: 220px; cursor: pointer; border: 0; font: inherit; }
  .source span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .source .live { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; flex: none; }
  .source.error .live { background: var(--bad); }

  .scroll { flex: 1; overflow-y: auto; padding: 0 12px 12px; display: grid; gap: 10px; align-content: start; }
  .card { background: var(--card); border-radius: 12px; box-shadow: var(--shadow), 0 0 0 1px var(--line); }

  .settings { padding: 12px; display: grid; gap: 8px; }
  label span { display: block; color: var(--ink-2); font-size: 11.5px; margin-bottom: 4px; font-weight: 500; }
  input:not([type=checkbox]), select { width: 100%; height: 30px; border: 1px solid var(--line-2); border-radius: 7px; padding: 0 9px; font: 12px var(--mono); background: #fff; color: var(--ink); }
  select { font-family: var(--sans); }
  input:not([type=checkbox]):focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash); }

  .summary-line { display: flex; align-items: baseline; gap: 8px; padding: 12px 14px; }
  .summary-line strong { font-size: 22px; line-height: 26px; font-weight: 500; letter-spacing: -.02em; }
  .summary-line.warn strong { color: var(--warn); }
  .summary-line span { color: var(--ink-2); }
  .more { width: 100%; height: 38px; border: 0; border-top: 1px solid var(--line); background: none; color: var(--ink-2); font: 500 12px var(--sans); cursor: pointer; }
  .more:hover { background: #fcfcfc; color: var(--ink); }
  #moreRows .row { opacity: .85; }
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; }
  .stat { padding: 12px 14px; display: grid; gap: 2px; }
  .stat + .stat { border-left: 1px solid var(--line); }
  .stat small { color: var(--ink-3); font-size: 11px; }
  .stat strong { font-size: 20px; line-height: 26px; font-weight: 500; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .stat.warn strong { color: var(--warn); }
  .commit { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); color: var(--ink-2); }
  .commit .commit-msg { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .commit .mono { color: var(--ink-3); flex: none; }

  .list-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 8px; }
  .list-head strong { font-weight: 500; font-size: 13px; }
  .select-all { border: 0; background: none; color: var(--accent-ink); font: inherit; font-weight: 500; cursor: pointer; padding: 0; }
  .pill { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 6px; font-size: 11px; font-weight: 500; white-space: nowrap; }
  .pill::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.good { background: var(--good-bg); color: var(--good); }
  .pill.neutral { background: var(--raised); color: var(--ink-3); }

  .row { display: grid; grid-template-columns: 16px 32px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 48px; padding: 6px 14px; border-top: 1px solid var(--line); cursor: pointer; transition: background-color 120ms; }
  .row:hover { background: #fcfcfc; }
  .row.picked { background: var(--accent-wash); }
  .row.muted { cursor: default; grid-template-columns: 16px 32px minmax(0, 1fr) auto; }
  .row.muted:hover { background: none; }
  .row input { width: 15px; height: 15px; margin: 0; accent-color: var(--accent); }
  .name { min-width: 0; }
  .name .mono { display: inline; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); font-size: 12px; }
  .name small { display: block; color: var(--ink-3); font-size: 11px; }
  .name .mode { display: inline-block; margin-left: 6px; padding: 0 5px; height: 16px; line-height: 14px; border-radius: 4px; border: 1px solid var(--line-2); color: var(--ink-2); font-size: 10px; font-weight: 500; vertical-align: 1px; }
  .alias { font-family: var(--mono); color: inherit; }
  .pill.new { background: var(--accent-wash); color: var(--accent-ink); }
  .none { color: var(--ink-3); }
  .vals { display: flex; align-items: center; gap: 6px; font: 11.5px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .vals > span { display: inline-flex; align-items: center; line-height: 16px; }
  .vals .chip { vertical-align: 0; margin-top: 0; }
  .vals .from { color: var(--ink-3); }
  .vals .to { color: var(--accent-ink); font-weight: 600; }
  .vals .arrow { color: var(--ink-3); }
  .chip { width: 10px; height: 10px; border-radius: 3px; display: inline-block; vertical-align: -1px; margin-right: 4px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.14); }
  .venn { width: 32px; height: 24px; overflow: visible; }
  .venn .f { fill: none; stroke: #a1a1aa; stroke-width: 1.4; stroke-dasharray: 3 2.5; }
  .venn .c { fill: var(--accent-wash); stroke: var(--accent); stroke-width: 1.4; }
  .venn .sw { stroke: rgba(0,0,0,.14); stroke-width: 1; }
  .venn .swc { mix-blend-mode: multiply; }
  .venn .t { stroke: var(--ink-3); stroke-width: 1; }
  .empty-row { padding: 18px 14px; border-top: 1px solid var(--line); color: var(--ink-3); text-align: center; }

  .msg { padding: 10px 12px; border-radius: 10px; background: var(--card); box-shadow: var(--shadow), 0 0 0 1px var(--line); color: var(--ink-2); }
  .msg.error { background: var(--bad-bg); color: var(--bad); box-shadow: 0 0 0 1px rgba(220,38,38,.15); }
  .msg.ok { background: var(--good-bg); color: var(--good); box-shadow: 0 0 0 1px rgba(21,128,61,.15); }
  .note { color: var(--ink-3); font-size: 11px; padding: 0 4px; }

  footer { padding: 12px 16px 14px; background: var(--card); border-top: 1px solid var(--line); display: grid; gap: 10px; }
  .consent { display: flex; gap: 8px; align-items: flex-start; color: var(--ink-2); cursor: pointer; }
  .consent input { width: 15px; height: 15px; margin: 1px 0 0; accent-color: var(--accent); flex: none; }
  .consent.off { opacity: .5; cursor: default; }
  .actions { display: flex; gap: 8px; }
  button.b { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-2); background: #fff; color: var(--ink); font: 500 12.5px var(--sans); cursor: pointer; box-shadow: var(--shadow); transition: background-color 120ms, transform 120ms; }
  button.b:hover:not(:disabled) { background: var(--raised); }
  button.b:active:not(:disabled) { transform: scale(.98); }
  button.b.primary { flex: 1; background: linear-gradient(#2a2a2e, #18181b); border-color: #18181b; color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 1px 2px rgba(0,0,0,.12); }
  button.b.primary:hover:not(:disabled) { background: #000; }
  button.b:disabled { opacity: .4; cursor: not-allowed; }
  button.b svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<header>
  <div class="brand"><svg viewBox="0 0 28 18" aria-hidden="true"><circle cx="10" cy="9" r="7"/><circle cx="18" cy="9" r="7"/></svg>Venn</div>
  <button class="source" id="sourceButton" type="button" title="Source and collection"><span class="live"></span><span id="sourceLabel">Connecting</span></button>
</header>

<div class="scroll">
  <div class="card settings hidden" id="settings">
    <label><span>Repository</span><input id="repo" spellcheck="false"></label>
    <label><span>Token file</span><input id="path" spellcheck="false"></label>
    <label><span>Variable collection</span><select id="collection"><option value="">First collection</option></select></label>
    <button class="b" id="save" type="button">Save and check</button>
  </div>

  <div class="card summary-card">
    <div class="summary-line"><strong id="nDiffer">–</strong><span id="summaryText">Checking GitHub and this file</span></div>
    <div class="commit"><span class="mono" id="sha">———————</span><span class="commit-msg" id="sub"></span></div>
  </div>

  <div class="card">
    <div class="list-head"><strong id="summary">Differences</strong><span id="tagWrap"><span class="pill neutral">Checking</span></span></div>
    <div id="rows"></div>
    <button class="more hidden" id="moreToggle" type="button"></button>
    <div id="moreRows" class="hidden"></div>
  </div>

  <p class="msg hidden" id="msg" role="status"></p>
  <p class="note">Venn only edits variables you tick, reads each value back, and undoes the whole run if any value does not match. It never runs in the background.</p>
</div>

<footer>
  <label class="consent off" id="consentWrap"><input type="checkbox" id="consent" disabled><span>I reviewed the selected changes and want to update this file</span></label>
  <div class="actions" id="applyRow">
    <button class="b" id="refresh" type="button" title="Check again"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>Check</button>
    <button class="b primary" id="apply" type="button" disabled>Apply in Figma</button>
  </div>
  <div class="actions hidden" id="receiptRow">
    <button class="b" id="checkAgain" type="button" title="Check again"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></button>
    <button class="b" id="download" type="button" title="Download receipt"><svg viewBox="0 0 24 24"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg>File</button>
    <button class="b primary" id="record" type="button"><svg viewBox="0 0 28 18"><circle cx="10" cy="9" r="7"/><circle cx="18" cy="9" r="7"/></svg>Record in Venn</button>
  </div>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const post = (msg) => parent.postMessage({ pluginMessage: msg }, '*');
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let rows = [], receipt = null, site = '';

const chip = (type, v) => (type === 'color' && v ? `<span class="chip" style="background:${esc(v)}"></span>` : '');
// A value as Figma or code holds it: a raw value, or an alias shown by name with its resolved swatch.
const fmt = (type, v, alias) => {
  if (alias) return `${chip(type, v)}<span class="alias">{${esc(alias.split('/').slice(-2).join('/'))}}</span>`;
  if (v === undefined || v === null) return '<span class="none">—</span>';
  return `${chip(type, v)}${esc(v)}`;
};
const NOTE = {
  differs: (r) => (r.figmaAlias && !r.codeAlias ? 'Alias in Figma, plain value in code' : !r.figmaAlias && r.codeAlias ? 'Hard-coded in Figma, alias in code' : r.figmaAlias ? 'Points at a different variable' : 'Value differs from code'),
  missing: () => 'Not in Figma yet, will be created',
  match: () => 'Matches code',
  extra: () => 'In Figma only, left as is',
  nomode: (r) => `No ${r.mode} mode in this collection`,
  type: () => 'Different type in Figma, skipped',
  unsupported: () => 'Unsupported value in Figma, skipped',
};
const fixable = (r) => (r.status === 'differs' || r.status === 'missing') && !r.follows;

// Figma's value (dashed) over code's value (cobalt), same drawing as the website.
function venn(r) {
  if (r.type === 'color') {
    const a = r.figma ? `<circle class="sw" cx="11" cy="12" r="9" fill="${esc(r.figma)}"/>` : `<circle class="f" cx="11" cy="12" r="9"/>`;
    const b = r.code ? `<circle class="sw swc" cx="21" cy="12" r="9" fill="${esc(r.code)}"/>` : `<circle class="f" cx="21" cy="12" r="9"/>`;
    return `<svg class="venn" viewBox="0 0 32 24" aria-hidden="true">${a}${b}</svg>`;
  }
  const before = typeof r.figma === 'number' ? r.figma : 0, after = typeof r.code === 'number' ? r.code : 0;
  if (/radius/.test(r.name)) {
    const k = (v) => Math.max(0, Math.min(8, v));
    return `<svg class="venn" viewBox="0 0 32 24" aria-hidden="true"><rect class="c" x="3" y="4" width="26" height="16" rx="${k(after)}"/><rect class="f" x="3" y="4" width="26" height="16" rx="${k(before)}"/></svg>`;
  }
  const max = Math.max(before, after, 1), w = (v) => Math.max(2, Math.round((v / max) * 26));
  return `<svg class="venn" viewBox="0 0 32 24" aria-hidden="true"><line class="t" x1="3" y1="4" x2="3" y2="20"/><rect class="f" x="3" y="6" width="${w(before)}" height="5" rx="1.5"/><rect class="c" x="3" y="13" width="${w(after)}" height="5" rx="1.5"/></svg>`;
}

function message(text, kind) { const m = $('msg'); m.textContent = text; m.className = 'msg ' + (kind || ''); }
function selected() { return Array.from(document.querySelectorAll('.pick:checked')).map((i) => i.value); }
function syncButtons() {
  const n = selected().length;
  document.querySelectorAll('.pick').forEach((i) => i.closest('.row').classList.toggle('picked', i.checked));
  $('consent').disabled = n === 0;
  $('consentWrap').classList.toggle('off', n === 0);
  if (!n) $('consent').checked = false;
  $('apply').disabled = !(n && $('consent').checked);
  $('apply').textContent = n ? `Apply ${n} ${n === 1 ? 'change' : 'changes'} in Figma` : 'Apply in Figma';
}
function render(data) {
  rows = data.rows.filter((r) => !r.follows);
  const todo = rows.filter(fixable);
  const matches = rows.filter((r) => r.status === 'match');
  const quiet = rows.filter((r) => !fixable(r) && r.status !== 'match');
  $('nDiffer').textContent = todo.length;
  $('nDiffer').parentElement.classList.toggle('warn', todo.length > 0);
  const created = todo.filter((r) => r.status === 'missing').length;
  $('summaryText').textContent = todo.length
    ? `to fix${created ? `, ${created} to create` : ''} · ${matches.length} already match`
    : `Figma matches code · ${matches.length} values checked`;
  $('sha').textContent = data.sha.slice(0, 7);
  $('sub').textContent = data.message;
  $('sourceLabel').textContent = data.collection + (data.modes && data.modes.length > 1 ? ` · ${data.modes.join(', ')}` : '');
  $('sourceButton').classList.remove('error');
  $('summary').textContent = todo.length ? 'To fix' : 'All values';
  $('tagWrap').innerHTML = todo.length
    ? `<button class="select-all" id="selectAll" type="button">Select all</button>`
    : `<span class="pill good">Up to date</span>`;
  const label = (r) => `<span class="name"><span class="mono">${esc(r.name)}</span>${r.mode ? `<span class="mode">${esc(r.mode)}</span>` : ''}<small>${esc(NOTE[r.status](r))}</small></span>`;
  const rowHtml = (r) => fixable(r)
    ? `<label class="row"><input type="checkbox" class="pick" value="${esc(r.key)}">${venn(r)}${label(r)}<span class="vals">${r.status === 'missing' ? '<span class="pill new">New</span>' : `<span class="from">${fmt(r.type, r.figma, r.figmaAlias)}</span><span class="arrow">→</span>`}<span class="to">${fmt(r.type, r.code, r.codeAlias)}</span></span></label>`
    : `<div class="row muted"><span></span><span></span>${label(r)}<span class="vals">${r.status === 'match' ? fmt(r.type, r.figma, r.figmaAlias) : `<span class="pill neutral">${r.status === 'extra' ? 'Figma only' : 'Skipped'}</span>`}</span></div>`;
  const byName = (a, b) => (a.name + (a.mode || '')).localeCompare(b.name + (b.mode || ''));
  const shown = todo.slice().sort((a, b) => (a.status === 'missing') - (b.status === 'missing') || byName(a, b)).concat(quiet.sort(byName));
  const folded = matches.sort(byName);
  $('rows').innerHTML = shown.length ? shown.map(rowHtml).join('') : (folded.length ? '' : `<div class="empty-row">No colour or number tokens found in this file</div>`);
  $('moreRows').innerHTML = folded.map(rowHtml).join('');
  const toggle = $('moreToggle');
  const open = !shown.length;
  $('moreRows').classList.toggle('hidden', !open);
  toggle.classList.toggle('hidden', !folded.length || open);
  toggle.textContent = `Show ${folded.length} matching`;
  toggle.onclick = () => { const hidden = $('moreRows').classList.toggle('hidden'); toggle.textContent = hidden ? `Show ${folded.length} matching` : 'Hide matching'; };
  const sel = $('collection');
  sel.innerHTML = '<option value="">First collection</option>' + data.collections.map((c) => `<option ${c === data.collection ? 'selected' : ''}>${esc(c)}</option>`).join('');
  document.querySelectorAll('.pick').forEach((i) => i.addEventListener('change', syncButtons));
  const all = $('selectAll');
  if (all) all.onclick = () => { const picks = document.querySelectorAll('.pick'); const on = Array.from(picks).some((i) => !i.checked); picks.forEach((i) => { i.checked = on; }); all.textContent = on ? 'Clear' : 'Select all'; syncButtons(); };
  syncButtons();
}
function check(config) { $('apply').disabled = true; message('Checking GitHub and this file…'); post({ type: 'check', config }); }

$('sourceButton').onclick = () => $('settings').classList.toggle('hidden');
$('consent').onchange = syncButtons;
function resetAfterRecord() { $('applyRow').classList.remove('hidden'); $('consentWrap').classList.remove('hidden'); $('receiptRow').classList.add('hidden'); }
$('refresh').onclick = () => resetAfterRecord() || check({ repo: $('repo').value, path: $('path').value, collection: $('collection').value });
$('checkAgain').onclick = () => $('refresh').onclick();
$('save').onclick = () => { $('settings').classList.add('hidden'); $('refresh').onclick(); };
$('apply').onclick = () => { const names = selected(); $('apply').disabled = true; message('Applying and reading values back…'); post({ type: 'apply', names, confirmed: $('consent').checked }); };
$('download').onclick = () => {
  if (!receipt) return;
  const url = URL.createObjectURL(new Blob([JSON.stringify(receipt, null, 2) + '\n'], { type: 'application/json' }));
  const a = document.createElement('a'); a.href = url; a.download = `venn-receipt-${receipt.sourceSha.slice(0, 7)}.json`;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
};

$('record').onclick = () => {
  if (!receipt || !site) return;
  const json = JSON.stringify(receipt);
  const b64 = btoa(unescape(encodeURIComponent(json))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  post({ type: 'open', url: site + '#receipt=' + b64 });
  message('Opening Venn in your browser…', 'ok');
};

window.onmessage = (e) => {
  const m = e.data && e.data.pluginMessage; if (!m) return;
  if (m.type === 'config') { $('repo').value = m.config.repo; $('path').value = m.config.path; site = m.site; }
  if (m.type === 'checked') { render(m); if (!receipt) $('msg').classList.add('hidden'); }
  if (m.type === 'applied') {
    receipt = m.receipt;
    $('receiptRow').classList.remove('hidden');
    $('applyRow').classList.add('hidden');
    $('consentWrap').classList.add('hidden');
    message(`Updated ${receipt.changes.length} ${receipt.changes.length === 1 ? 'variable' : 'variables'} and Figma confirmed every value. Press Record in Venn to update your dashboard.`, 'ok');
  }
  if (m.type === 'error') { message(m.message, 'error'); $('sourceButton').classList.add('error'); syncButtons(); }
};
post({ type: 'init' });
</script>
</body>
</html>
