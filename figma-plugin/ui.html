<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { --ink:#1d1d1f; --ink-2:#5f6368; --ink-3:#8e9196; --line:#e7e7e4; --accent:#0a7a4b; --accent-soft:#e8f4ee; --warn:#9a5b00; --warn-soft:#fbf1df; --danger:#b3261e;
    font: 12.5px/1.5 -apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif; color: var(--ink); background: #fff; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; }
  h1 { font-size: 17px; letter-spacing: -0.015em; margin: 0; }
  p { margin: 0; }
  .sub { color: var(--ink-2); margin-top: 4px; }
  details { margin: 16px 0; border: 1px solid var(--line); border-radius: 10px; }
  summary { cursor: pointer; padding: 10px 12px; color: var(--ink-2); font-weight: 550; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  .config { padding: 0 12px 12px; display: grid; gap: 8px; }
  label span { display: block; color: var(--ink-2); font-size: 11.5px; margin-bottom: 3px; font-weight: 550; }
  input, select { width: 100%; height: 32px; border: 1px solid #d6d6d2; border-radius: 7px; padding: 0 9px; font: inherit; background: #fff; }
  .status { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 4px 0 10px; }
  .status strong { font-size: 13.5px; }
  .tag { padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 650; background: var(--warn-soft); color: var(--warn); white-space: nowrap; }
  .tag.ok { background: var(--accent-soft); color: var(--accent); }
  .rows { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; }
  .row + .row { border-top: 1px solid var(--line); }
  .row.muted { color: var(--ink-3); }
  .name { font-weight: 600; overflow-wrap: anywhere; }
  .name small { display: block; font-weight: 400; color: var(--ink-3); }
  .vals { font: 11.5px ui-monospace, Menlo, monospace; display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  .old { color: var(--ink-3); text-decoration: line-through; }
  .sw { width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(0,0,0,.15); display: inline-block; vertical-align: -2px; margin-right: 3px; }
  .consent { display: flex; gap: 8px; align-items: flex-start; margin: 14px 0; color: var(--ink-2); }
  .consent input, .row input { width: 15px; height: 15px; margin: 0; accent-color: var(--ink); }
  .actions { display: flex; gap: 8px; }
  button { font: inherit; font-weight: 600; height: 34px; border-radius: 999px; padding: 0 16px; border: 1px solid #d6d6d2; background: #fff; cursor: pointer; }
  button.primary { background: var(--ink); color: #fff; border-color: var(--ink); flex: 1; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .msg { margin: 12px 0 0; padding: 10px 12px; border-radius: 9px; background: #f5f5f3; color: var(--ink-2); }
  .msg.error { background: #fdeceb; color: var(--danger); }
  .msg.ok { background: var(--accent-soft); color: var(--accent); }
  .note { color: var(--ink-3); font-size: 11.5px; margin-top: 14px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<h1>Venn</h1>
<p class="sub" id="sub">Checking GitHub and this file…</p>

<details id="settings">
  <summary>Source and collection</summary>
  <div class="config">
    <label><span>Repository</span><input id="repo" spellcheck="false"></label>
    <label><span>Token file</span><input id="path" spellcheck="false"></label>
    <label><span>Variable collection</span><select id="collection"><option value="">First collection</option></select></label>
    <button id="save">Save and check</button>
  </div>
</details>

<div class="status"><strong id="summary">—</strong><span class="tag hidden" id="tag"></span></div>
<div class="rows" id="rows"></div>

<label class="consent"><input type="checkbox" id="consent" disabled><span>I reviewed the selected changes and want to update this file.</span></label>
<div class="actions"><button id="refresh">Check again</button><button class="primary" id="apply" disabled>Apply in Figma</button></div>
<div class="actions hidden" id="receiptRow" style="margin-top:8px"><button class="primary" id="download">Download receipt</button></div>
<p class="msg hidden" id="msg" role="status"></p>
<p class="note">Venn only edits variables you tick, reads each value back, and undoes the whole run if any value does not match. It never runs in the background.</p>

<script>
const $ = (id) => document.getElementById(id);
const post = (msg) => parent.postMessage({ pluginMessage: msg }, '*');
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let rows = [], receipt = null;

const fmt = (type, v) => v === undefined || v === null ? '—' : type === 'color' ? `<span class="sw" style="background:${esc(v)}"></span>${esc(v)}` : esc(v);
const LABEL = { match: 'Matches', missing: 'Not in Figma (not created)', type: 'Different type in Figma', alias: 'Uses an alias in Figma', unsupported: 'Unsupported value in Figma' };

function message(text, kind) { const m = $('msg'); m.textContent = text; m.className = 'msg ' + (kind || ''); }
function selected() { return Array.from(document.querySelectorAll('.pick:checked')).map((i) => i.value); }
function syncButtons() {
  const n = selected().length;
  $('consent').disabled = n === 0;
  if (!n) $('consent').checked = false;
  $('apply').disabled = !(n && $('consent').checked);
  $('apply').textContent = n ? `Apply ${n} ${n === 1 ? 'change' : 'changes'} in Figma` : 'Apply in Figma';
}
function render(data) {
  rows = data.rows;
  const differs = rows.filter((r) => r.status === 'differs');
  $('sub').textContent = `${data.collection} · ${data.sha.slice(0, 7)} ${data.message}`;
  $('summary').textContent = differs.length ? `${differs.length} ${differs.length === 1 ? 'difference' : 'differences'} with code` : 'Figma matches code';
  $('tag').textContent = differs.length ? 'Needs review' : 'Up to date';
  $('tag').className = 'tag' + (differs.length ? '' : ' ok');
  const order = { differs: 0, missing: 1, type: 1, alias: 1, unsupported: 1, match: 2 };
  $('rows').innerHTML = rows.slice().sort((a, b) => order[a.status] - order[b.status]).map((r) => r.status === 'differs'
    ? `<label class="row"><input type="checkbox" class="pick" value="${esc(r.name)}"><span class="name">${esc(r.name)}<small>${esc(r.type)}</small></span><span class="vals"><span class="old">${fmt(r.type, r.figma)}</span>→<span>${fmt(r.type, r.code)}</span></span></label>`
    : `<div class="row muted"><span></span><span class="name">${esc(r.name)}<small>${esc(LABEL[r.status])}</small></span><span class="vals">${fmt(r.type, r.status === 'match' ? r.figma : r.code)}</span></div>`).join('');
  const sel = $('collection');
  sel.innerHTML = '<option value="">First collection</option>' + data.collections.map((c) => `<option ${c === data.collection ? 'selected' : ''}>${esc(c)}</option>`).join('');
  document.querySelectorAll('.pick').forEach((i) => i.addEventListener('change', syncButtons));
  syncButtons();
}
function check(config) { $('apply').disabled = true; message('Checking GitHub and this file…'); post({ type: 'check', config }); }

$('consent').onchange = syncButtons;
$('refresh').onclick = () => check({ repo: $('repo').value, path: $('path').value, collection: $('collection').value });
$('save').onclick = () => { $('settings').open = false; $('refresh').onclick(); };
$('apply').onclick = () => { const names = selected(); $('apply').disabled = true; message('Applying and reading values back…'); post({ type: 'apply', names, confirmed: $('consent').checked }); };
$('download').onclick = () => {
  if (!receipt) return;
  const url = URL.createObjectURL(new Blob([JSON.stringify(receipt, null, 2) + '\n'], { type: 'application/json' }));
  const a = document.createElement('a'); a.href = url; a.download = `venn-receipt-${receipt.sourceSha.slice(0, 7)}.json`;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
};

window.onmessage = (e) => {
  const m = e.data && e.data.pluginMessage; if (!m) return;
  if (m.type === 'config') { $('repo').value = m.config.repo; $('path').value = m.config.path; }
  if (m.type === 'checked') { render(m); if (!receipt) $('msg').classList.add('hidden'); }
  if (m.type === 'applied') {
    receipt = m.receipt;
    $('receiptRow').classList.remove('hidden');
    message(`Updated ${receipt.changes.length} ${receipt.changes.length === 1 ? 'variable' : 'variables'}. Figma confirmed every value. Download the receipt and import it in Venn.`, 'ok');
  }
  if (m.type === 'error') { message(m.message, 'error'); syncButtons(); }
};
post({ type: 'init' });
</script>
</body>
</html>
