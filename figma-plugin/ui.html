<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  /* Native Figma look: Figma's own theme variables (light and dark), 11px type, single-line rows. */
  :root {
    --bg: var(--figma-color-bg, #fff);
    --bg-2: var(--figma-color-bg-secondary, #f5f5f5);
    --bg-hover: var(--figma-color-bg-hover, #f5f5f5);
    --text: var(--figma-color-text, #1e1e1e);
    --text-2: var(--figma-color-text-secondary, rgba(0,0,0,.55));
    --text-3: var(--figma-color-text-tertiary, rgba(0,0,0,.35));
    --border: var(--figma-color-border, #e6e6e6);
    --brand: var(--figma-color-bg-brand, #0d99ff);
    --brand-hover: var(--figma-color-bg-brand-hover, #007be5);
    --on-brand: var(--figma-color-text-onbrand, #fff);
    --brand-text: var(--figma-color-text-brand, #007be5);
    --brand-soft: var(--figma-color-bg-brand-tertiary, #e5f4ff);
    --success: var(--figma-color-text-success, #14ae5c);
    --success-soft: var(--figma-color-bg-success-tertiary, #e7f6ec);
    --danger: var(--figma-color-text-danger, #dc3412);
    --danger-soft: var(--figma-color-bg-danger-tertiary, #fff0ee);
    font: 11px/16px Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .hidden { display: none !important; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10.5px; }
  svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }

  header { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 8px 0 12px; border-bottom: 1px solid var(--border); flex: none; }
  .logo { display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .logo svg { width: 20px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.4; }
  .collection { margin-left: auto; display: flex; align-items: center; gap: 4px; height: 24px; padding: 0 6px; border-radius: 5px; color: var(--text-2); max-width: 180px; }
  .collection:hover { background: var(--bg-hover); color: var(--text); }
  .collection span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .icon-btn { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 5px; color: var(--text-2); }
  .icon-btn:hover { background: var(--bg-hover); color: var(--text); }

  .commit { display: flex; gap: 6px; align-items: center; height: 28px; padding: 0 12px; color: var(--text-2); border-bottom: 1px solid var(--border); flex: none; }
  .commit .msg { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .commit .mono { color: var(--text-3); flex: none; }

  .scroll { flex: 1; overflow-y: auto; padding-bottom: 8px; }
  .section { display: flex; align-items: center; height: 32px; padding: 0 12px; font-weight: 600; gap: 6px; }
  .section .n { color: var(--text-3); font-weight: 400; }
  .section .link { margin-left: auto; color: var(--brand-text); font-weight: 400; }
  .section.toggle { cursor: pointer; color: var(--text-2); font-weight: 400; }
  .section.toggle:hover { color: var(--text); }
  .chev { width: 12px; height: 12px; transition: transform 120ms; }
  .open .chev { transform: rotate(90deg); }

  .row { display: grid; grid-template-columns: 12px 16px minmax(0, 1fr) auto; align-items: center; gap: 8px; height: 32px; padding: 0 12px; cursor: pointer; }
  .row:hover { background: var(--bg-hover); }
  .row.on { background: var(--brand-soft); }
  .row.quiet { cursor: default; color: var(--text-2); }
  .row.quiet:hover { background: none; }
  .row input { width: 12px; height: 12px; margin: 0; accent-color: var(--brand); }
  .name { display: flex; align-items: center; min-width: 0; }
  .name .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .name .mode { flex: none; }
  .mode { margin-left: 4px; padding: 0 4px; border-radius: 3px; background: var(--bg-2); color: var(--text-2); font-size: 10px; }
  .vals { display: flex; align-items: center; gap: 4px; white-space: nowrap; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10.5px; }
  .vals > span { display: inline-flex; align-items: center; }
  .vals .from { color: var(--text-3); }
  .vals .new { color: var(--brand-text); font-family: Inter, system-ui, sans-serif; font-size: 10px; font-weight: 600; }
  .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); margin-right: 3px; }
  .glyph { width: 16px; height: 16px; overflow: visible; }
  .glyph .f { fill: none; stroke: var(--text-3); stroke-width: 1; stroke-dasharray: 2 1.5; }
  .glyph .c { fill: none; stroke: var(--brand); stroke-width: 1.2; }
  .empty { padding: 36px 16px 20px; text-align: center; color: var(--text-2); }
  .empty svg { width: 40px; height: 26px; fill: none; stroke: var(--success); stroke-width: 1.4; margin-bottom: 8px; }
  .empty strong { display: block; color: var(--text); font-weight: 600; font-size: 12px; margin-bottom: 2px; }

  .banner { margin: 8px 12px 0; padding: 8px 10px; border-radius: 6px; }
  .banner.error { background: var(--danger-soft); color: var(--danger); }
  .banner.ok { background: var(--success-soft); color: var(--success); }
  .banner.info { background: var(--bg-2); color: var(--text-2); }

  .settings { padding: 12px; display: grid; gap: 10px; border-bottom: 1px solid var(--border); }
  .settings label span { display: block; color: var(--text-2); margin-bottom: 4px; }
  .settings input, .settings select { width: 100%; height: 28px; border: 1px solid var(--border); border-radius: 5px; padding: 0 8px; font: 11px Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); }
  .settings input:focus, .settings select:focus { outline: 1px solid var(--brand); border-color: var(--brand); }
  .settings .row-btns { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
  .settings .sample { margin-right: auto; color: var(--brand-text); }
  .setup-intro { margin: 0; color: var(--text-2); }
  .setup-intro strong { display: block; color: var(--text); font-size: 12px; margin-bottom: 2px; }

  footer { display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 12px; border-top: 1px solid var(--border); flex: none; }
  footer .hint { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  footer .spacer { flex: 1; }
  .btn { height: 28px; padding: 0 12px; border-radius: 5px; font-weight: 500; white-space: nowrap; display: inline-flex; align-items: center; }
  .btn.primary { background: var(--brand); color: var(--on-brand); }
  .btn.primary:hover:not(:disabled) { background: var(--brand-hover); }
  .btn.secondary { box-shadow: inset 0 0 0 1px var(--border); }
  .btn.secondary:hover { background: var(--bg-hover); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn svg { width: 14px; height: 9px; fill: none; stroke: currentColor; stroke-width: 1.5; margin-right: 6px; }
</style>
</head>
<body>
<header>
  <div class="logo"><svg viewBox="0 0 28 18" aria-hidden="true"><circle cx="10" cy="9" r="7"/><circle cx="18" cy="9" r="7"/></svg>Venn</div>
  <button class="collection" id="collectionButton" type="button" title="Settings: repository, token file and collection"><span id="collectionLabel">Connecting…</span><svg class="i" viewBox="0 0 16 16" style="width:13px;height:13px"><circle cx="8" cy="8" r="2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg></button>
  <button class="icon-btn" id="refresh" type="button" title="Check again"><svg class="i" viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M12.5 2v2.5H10"/></svg></button>
</header>
<div class="commit"><span class="mono" id="sha">———</span><span class="msg" id="sub">Checking GitHub and this file</span></div>

<div class="scroll" id="scroll">
  <div class="settings hidden" id="settings">
    <p class="setup-intro hidden" id="setupIntro"><strong>Connect your tokens</strong>The GitHub file Venn compares with this file's variables. Use the same repository you connected on the Venn site.</p>
    <label><span>GitHub repository</span><input id="repo" spellcheck="false" placeholder="owner/repository"></label>
    <label><span>Token file</span><input id="path" spellcheck="false" placeholder="tokens.json"></label>
    <label><span>Variable collection</span><select id="collection"><option value="">First collection</option></select></label>
    <div class="row-btns"><button class="link sample hidden" id="useSample" type="button">Use the Penny sample</button><button class="btn secondary" id="cancelSettings" type="button">Cancel</button><button class="btn primary" id="save" type="button">Save and check</button></div>
  </div>
  <p class="banner hidden" id="msg" role="status"></p>
  <div id="list"></div>
</div>

<footer id="footer">
  <span class="hint" id="hint"></span>
  <span class="spacer"></span>
  <button class="btn primary" id="apply" type="button" disabled>Apply</button>
</footer>
<footer class="hidden" id="doneFooter">
  <button class="btn secondary" id="download" type="button" title="Save the receipt as a file">Save receipt</button>
  <span class="spacer"></span>
  <button class="btn primary" id="record" type="button"><svg viewBox="0 0 28 18"><circle cx="10" cy="9" r="7"/><circle cx="18" cy="9" r="7"/></svg>Record in Venn</button>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const post = (msg) => parent.postMessage({ pluginMessage: msg }, '*');
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let rows = [], receipt = null, site = '', showMatching = false, lastData = null, sample = null, setupMode = false;

const sw = (type, v) => (type === 'color' && v ? `<span class="sw" style="background:${esc(v)}"></span>` : '');
const short = (alias) => '{' + alias.split('/').slice(-2).join('/') + '}';
const val = (type, v, alias) => (alias ? `${sw(type, v)}${esc(short(alias))}` : v === null || v === undefined ? '—' : `${sw(type, v)}${esc(v)}`);
const WHY = {
  differs: (r) => (r.figmaAlias && !r.codeAlias ? 'Alias in Figma, plain value in code' : !r.figmaAlias && r.codeAlias ? 'Hard-coded in Figma, alias in code' : r.figmaAlias ? 'Points at a different variable' : 'Value differs from code'),
  missing: () => 'Not in Figma yet, will be created',
  extra: () => 'Only in Figma, left as is',
  nomode: (r) => `This collection has no ${r.mode} mode`,
  type: () => 'Different type in Figma, skipped',
  unsupported: () => 'Value Venn cannot read, skipped',
  match: () => 'Matches code',
};
const fixable = (r) => (r.status === 'differs' || r.status === 'missing') && !r.follows;

// 16px glyph: Figma's value dashed, code's value in blue.
function glyph(r) {
  if (r.type === 'color') return `<svg class="glyph" viewBox="0 0 16 16">${r.figma ? `<circle cx="6" cy="8" r="5" fill="${esc(r.figma)}" stroke="rgba(0,0,0,.12)"/>` : `<circle class="f" cx="6" cy="8" r="5"/>`}${r.code ? `<circle cx="10" cy="8" r="5" fill="${esc(r.code)}" stroke="rgba(0,0,0,.12)" style="mix-blend-mode:multiply"/>` : ''}</svg>`;
  const k = (v) => Math.max(0, Math.min(5, typeof v === 'number' ? v / 2.5 : 0));
  if (/radius/i.test(r.name)) return `<svg class="glyph" viewBox="0 0 16 16"><rect class="c" x="1.5" y="3" width="13" height="10" rx="${k(r.code)}"/><rect class="f" x="1.5" y="3" width="13" height="10" rx="${k(r.figma)}"/></svg>`;
  const max = Math.max(r.figma || 0, r.code || 0, 1), w = (v) => Math.max(1, Math.round(((v || 0) / max) * 13));
  return `<svg class="glyph" viewBox="0 0 16 16"><rect class="f" x="1.5" y="4" width="${w(r.figma)}" height="3" rx="1"/><rect class="c" x="1.5" y="9" width="${w(r.code)}" height="3" rx="1"/></svg>`;
}

function rowHtml(r) {
  const name = `<span class="name"><span class="t">${esc(r.name)}</span>${r.mode ? `<span class="mode">${esc(r.mode)}</span>` : ''}</span>`;
  if (fixable(r)) {
    const vals = r.status === 'missing'
      ? `<span class="new">New</span><span>${val(r.type, r.code, r.codeAlias)}</span>`
      : `<span class="from">${val(r.type, r.figma, r.figmaAlias)}</span><span class="from">→</span><span>${val(r.type, r.code, r.codeAlias)}</span>`;
    return `<label class="row" title="${esc(WHY[r.status](r))}"><input type="checkbox" class="pick" value="${esc(r.key)}">${glyph(r)}${name}<span class="vals">${vals}</span></label>`;
  }
  const right = r.status === 'match' ? val(r.type, r.figma, r.figmaAlias) : esc(r.status === 'extra' ? 'Only in Figma' : 'Skipped');
  return `<div class="row quiet" title="${esc(WHY[r.status](r))}"><span></span>${r.status === 'match' ? glyph(r) : '<span></span>'}${name}<span class="vals">${right}</span></div>`;
}

function message(text, kind) { const m = $('msg'); m.textContent = text; m.className = 'banner ' + (kind || 'info'); }
function selected() { return Array.from(document.querySelectorAll('.pick:checked')).map((i) => i.value); }
function syncButtons() {
  const n = selected().length;
  const todo = document.querySelectorAll('.pick').length;
  document.querySelectorAll('.pick').forEach((i) => i.closest('.row').classList.toggle('on', i.checked));
  $('apply').disabled = !n;
  $('apply').textContent = n ? `Apply ${n} ${n === 1 ? 'change' : 'changes'}` : 'Apply';
  $('hint').textContent = todo ? (n ? `${n} of ${todo} selected` : 'Tick what to update in Figma') : '';
  const all = $('selectAll');
  if (all) all.textContent = n === todo ? 'Clear' : 'Select all';
}

function render(data) {
  lastData = data;
  rows = data.rows.filter((r) => !r.follows);
  const todo = rows.filter(fixable).sort((a, b) => (a.status === 'missing') - (b.status === 'missing') || (a.name + (a.mode || '')).localeCompare(b.name + (b.mode || '')));
  const quiet = rows.filter((r) => !fixable(r) && r.status !== 'match');
  const matching = rows.filter((r) => r.status === 'match');
  $('sha').textContent = data.sha.slice(0, 7);
  $('sub').textContent = data.message;
  $('collectionLabel').textContent = data.collection + (data.modes && data.modes.length > 1 ? ` · ${data.modes.length} modes` : '');
  let html = '';
  if (todo.length) {
    html += `<div class="section">To update <span class="n">${todo.length}</span><button class="link" id="selectAll" type="button">Select all</button></div>` + todo.map(rowHtml).join('');
  } else {
    html += `<div class="empty"><svg viewBox="0 0 28 18"><circle cx="12" cy="9" r="7"/><circle cx="16" cy="9" r="7"/></svg><strong>Figma matches code</strong>${matching.length} values checked</div>`;
  }
  if (quiet.length) html += `<div class="section">Left as is <span class="n">${quiet.length}</span></div>` + quiet.map(rowHtml).join('');
  if (matching.length) {
    html += `<div class="section toggle ${showMatching ? 'open' : ''}" id="toggleMatching"><svg class="i chev" viewBox="0 0 16 16"><path d="m6 4 4 4-4 4"/></svg>Matching <span class="n">${matching.length}</span></div>`;
    if (showMatching) html += matching.map(rowHtml).join('');
  }
  $('list').innerHTML = html;
  document.querySelectorAll('.pick').forEach((i) => i.addEventListener('change', syncButtons));
  const all = $('selectAll');
  if (all) all.onclick = (e) => { e.preventDefault(); const picks = document.querySelectorAll('.pick'); const on = selected().length !== picks.length; picks.forEach((i) => { i.checked = on; }); syncButtons(); };
  const t = $('toggleMatching');
  if (t) t.onclick = () => { const keep = selected(); showMatching = !showMatching; render(lastData); document.querySelectorAll('.pick').forEach((i) => { i.checked = keep.includes(i.value); }); syncButtons(); };
  $('collection').innerHTML = '<option value="">First collection</option>' + data.collections.map((c) => `<option ${c === data.collection ? 'selected' : ''}>${esc(c)}</option>`).join('');
  syncButtons();
}

function showWorking() { $('footer').classList.remove('hidden'); $('doneFooter').classList.add('hidden'); }
function check(config) {
  if (!/^[\w.-]+\/[\w.-]+$/.test(String(config.repo).trim()) || !String(config.path).trim()) { message('Enter the repository as owner/name and the path to its token file.', 'error'); return; }
  setupMode = false;
  $('setupIntro').classList.add('hidden'); $('useSample').classList.add('hidden'); $('cancelSettings').classList.remove('hidden');
  showSettings(false);
  showWorking();
  $('apply').disabled = true;
  message('Checking GitHub and this file…');
  post({ type: 'check', config });
}

function showSettings(on) {
  $('settings').classList.toggle('hidden', !on);
  $('list').classList.toggle('hidden', on);
  if (on) { $('apply').disabled = true; $('repo').focus(); } else syncButtons();
}
$('collectionButton').onclick = () => { if (!setupMode) showSettings($('settings').classList.contains('hidden')); };
$('cancelSettings').onclick = () => showSettings(false);
$('useSample').onclick = () => { if (sample) { $('repo').value = sample.repo; $('path').value = sample.path; } };
$('refresh').onclick = () => { receipt = null; check({ repo: $('repo').value, path: $('path').value, collection: $('collection').value }); };
$('save').onclick = () => $('refresh').onclick();
$('apply').onclick = () => {
  const names = selected();
  if (!names.length) return;
  $('apply').disabled = true;
  message(`Updating ${names.length} ${names.length === 1 ? 'value' : 'values'} and reading them back…`);
  post({ type: 'apply', names, confirmed: true });
};
$('download').onclick = () => {
  if (!receipt) return;
  const url = URL.createObjectURL(new Blob([JSON.stringify(receipt, null, 2) + '\n'], { type: 'application/json' }));
  const a = document.createElement('a'); a.href = url; a.download = `venn-receipt-${receipt.sourceSha.slice(0, 7)}.json`;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
};
$('record').onclick = () => {
  if (!receipt || !site) return;
  const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(receipt)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  post({ type: 'open', url: site + '#receipt=' + b64 });
  message('Opening Venn in your browser…', 'ok');
};

window.onmessage = (e) => {
  const m = e.data && e.data.pluginMessage; if (!m) return;
  if (m.type === 'config') {
    $('repo').value = m.config.repo; $('path').value = m.config.path; site = m.site;
    if (m.setup) {
      setupMode = true; sample = m.sample;
      $('collection').innerHTML = '<option value="">First collection</option>' + (m.collections || []).map((c) => `<option>${esc(c)}</option>`).join('');
      $('setupIntro').classList.remove('hidden'); $('useSample').classList.remove('hidden'); $('cancelSettings').classList.add('hidden');
      $('collectionLabel').textContent = 'Not connected';
      $('sha').textContent = ''; $('sub').textContent = 'Choose a token file to compare with';
      $('msg').classList.add('hidden');
      showSettings(true);
      $('hint').textContent = '';
    }
  }
  if (m.type === 'checked') { render(m); if (!receipt) $('msg').classList.add('hidden'); }
  if (m.type === 'applied') {
    receipt = m.receipt;
    const n = receipt.changes.length;
    message(`${n} ${n === 1 ? 'value' : 'values'} updated and confirmed by Figma. Record it in Venn to update your dashboard.`, 'ok');
    $('footer').classList.add('hidden');
    $('doneFooter').classList.remove('hidden');
  }
  if (m.type === 'error') { message(m.message, 'error'); syncButtons(); }
};
post({ type: 'init' });
</script>
</body>
</html>
